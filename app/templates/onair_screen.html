<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-07-01 송출 화면 · {{ station }}</title>
<script src="/static/js/common.js"></script>
<script src="/static/js/anchor2d.js"></script>
<script src="/static/js/anchor3d.js"></script>
<style>
  /* 1920×1080 고정 — OBS 브라우저 소스 크기를 1920×1080으로 (NFR-05) */
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#060A14; color:#F2F5FA;
               font-family:'Noto Sans KR',system-ui,sans-serif }
  #stage { position:relative; width:1920px; height:1080px }
  #anchor { position:absolute; left:40px; top:40px; width:820px; height:820px; border-radius:16px; overflow:hidden;
            background:linear-gradient(160deg,#1A2440,#0B1120); border:2px solid #24304A }
  #anchor video { width:100%; height:100%; object-fit:cover }
  #anchor .label { position:absolute; left:20px; top:16px; font-size:26px; font-weight:800; color:#9AA6BC; z-index:2 }
  #chart { overflow:hidden; position:absolute; left:900px; top:40px; width:980px; height:820px; border-radius:16px; background:#0B1120;
           border:2px solid #24304A; padding:40px; box-sizing:border-box }
  #chart svg.map path { stroke:#0B1120; stroke-width:3 } #chart svg.map text { font-size:15px; font-weight:800 }
  #chart h2 { font-size:44px; margin:0 0 40px } #chart .row { display:flex; align-items:center; gap:24px; margin:34px 0; font-size:34px; font-weight:800 }
  #chart .nm { width:250px; flex:none; white-space:nowrap } #chart .v { flex:none } #chart .b { height:70px; border-radius:10px; transition:width .8s } #chart .v { font-variant-numeric:tabular-nums }
  #chart .flag { white-space:nowrap; flex:none; font-size:26px; background:#FFB020; color:#1a1200; border-radius:8px; padding:2px 12px; margin-left:12px }
  #live { position:absolute; right:52px; top:52px; background:#E0483E; color:#fff; font-weight:800; font-size:30px; padding:6px 18px;
          border-radius:10px; z-index:3 }
  #headline { position:absolute; left:0; right:0; top:890px; height:100px; background:#E0483E; display:flex; align-items:center;
              padding:0 50px; font-size:46px; font-weight:800; box-sizing:border-box; white-space:nowrap; overflow:hidden }
  #ticker { position:absolute; left:0; right:0; top:990px; height:90px; background:#0B1120; display:flex; align-items:center; gap:46px;
            padding:0 50px; font-size:34px; box-sizing:border-box }
  #ticker .sp { flex:1 }
  #full { position:absolute; inset:0; background:#000; display:none; z-index:5 } #full video { width:100%; height:100%; object-fit:contain }
  #slate { position:absolute; inset:0; display:none; z-index:6; background:radial-gradient(circle at 50% 40%,#1A2440,#05070D);
           align-items:center; justify-content:center; flex-direction:column; text-align:center }
  #slate .t { font-size:90px; font-weight:900 } #slate .s { font-size:36px; color:#9AA6BC; margin-top:24px }
  #gate { position:absolute; inset:0; z-index:9; background:rgba(5,7,13,.92); display:flex; align-items:center; justify-content:center;
          flex-direction:column; font-size:40px; cursor:pointer }
  #gate small { font-size:24px; color:#9AA6BC; margin-top:16px }
</style>
</head>
<body>
<div id="stage">
  <div id="anchor"><div id="a2d" style="position:absolute;inset:0"></div><video id="loop" muted loop playsinline style="display:none;position:absolute;inset:0"></video><video id="avatar" playsinline style="display:none;position:absolute;inset:0"></video></div>
  <div id="chart"><h2 id="ctitle">전체 · 개표율 0%</h2><div id="bars"></div></div>
  <div id="live">● LIVE <span id="clock">00:00</span></div>
  <div id="headline">2026 한빛시장 모의선거 개표방송</div>
  <div id="ticker"><span id="tk"></span><span class="sp"></span><b id="tkrate">전체 개표율 0%</b></div>
  <div id="full"><video id="fullv" playsinline></video></div>
  <div id="slate"><div class="t" id="slt"></div><div class="s" id="sls"></div></div>
  <div id="gate">▶ 클릭해서 송출 화면 시작<small>소리 재생을 위해 한 번 눌러 주세요 (OBS에서는 자동 재생 허용)</small></div>
</div>
<audio id="voice"></audio><audio id="bgm" src="/static/media/bgm.mp3" loop></audio>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
let paused = false, startedAt = null, regionNow = 'ALL', abortNow = false, reading = false;
const $ = id => document.getElementById(id);
// 앵커 루프 영상 (있으면)
// 앵커 자리: 기본은 3D AI 앵커 (WebGL을 못 쓰는 PC면 자동으로 2D).
//   ?anchor=2d   → 2D AI 앵커
//   ?anchor=loop → anchor_loop.mp4 반복 영상 (학생 팀이 만든 영상 쓸 때)
const ANCHOR_MODE = new URLSearchParams(location.search).get('anchor') || '3d';
const anchorOpt = { station: {{ station|tojson }}, code: {{ code|tojson }} };
let ANCHOR = Anchor2D;
if (ANCHOR_MODE === '3d' && Anchor3D.mount($('a2d'), anchorOpt)) ANCHOR = Anchor3D;
else Anchor2D.mount($('a2d'), anchorOpt);
if (ANCHOR_MODE === 'loop') {
  $('loop').src = '/static/media/anchor_loop.mp4';
  $('loop').onloadeddata = () => { $('a2d').style.display = 'none'; $('loop').style.display = 'block'; $('loop').play().catch(() => {}); };
}
$('bgm').volume = 0.25;

async function drawChart(code) {
  regionNow = code;
  try {
    const d = await api('GET', '/api/public/results/' + code);
    $('ctitle').textContent = `${d.region} · 개표율 ${d.counted_rate.toFixed(1)}%`;
    $('bars').innerHTML = d.candidates.map(c => `<div class="row"><span class="nm">기호${c.id} ${esc(c.name)}</span>
      <div class="b" style="width:${Math.max(4, c.rate * 9)}px;background:${c.color};box-shadow:0 0 22px ${c.color}"></div>
      <span class="v">${c.rate.toFixed(1)}%</span>${c.winner_flag ? `<span class="flag">${FLAG_KO[c.winner_flag]}</span>` : ''}</div>`).join('');
  } catch (e) {}
}
async function drawTicker() {
  try {
    const d = await api('GET', '/api/public/results');
    $('tk').innerHTML = d.candidates.sort((a, b) => a.id - b.id).map(c =>
      `<span style="color:${c.color}">●</span> <b style="color:${c.color}">${esc(c.name)}</b> ${c.rate.toFixed(1)}%`).join('&nbsp;&nbsp;&nbsp;&nbsp;');
    $('tkrate').textContent = `전체 개표율 ${d.counted_rate.toFixed(1)}%`;
  } catch (e) {}
}
function waitMedia(el, maxSec) {   // 재생이 끝나거나 최대 시간이 지나면 다음으로 (멈춤 방지)
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    el.onended = fin; el.onerror = fin;
    const t0 = Date.now(); (function chk() { if (done) return; if (abortNow || (!paused && (Date.now() - t0) / 1000 > maxSec)) return fin(); setTimeout(chk, 500); })();
  });
}
function speak(text, maxSec) {      // OpenAI 키가 없을 때: 브라우저 음성으로 읽기 (연습용)
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return setTimeout(res, maxSec * 1000);
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.05;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(fin, (maxSec + 8) * 1000);
    (function chk() { if (done) return; if (abortNow) { speechSynthesis.cancel(); return fin(); } setTimeout(chk, 300); })();
  });
}
async function waitSec(sec) { let left = sec; while (left > 0 && !abortNow) { await sleep(250); if (!paused) left -= 0.25; } }

async function playVideo(n) {
  $('full').style.display = 'block'; $('bgm').pause();
  const v = $('fullv'); v.src = n.src; v.currentTime = 0;
  await v.play().catch(() => {});
  await waitMedia(v, (n.duration_sec || 60) + 5);
  $('full').style.display = 'none'; v.pause();
}
async function playSlate(n) {
  $('slate').style.display = 'flex'; $('slt').textContent = n.title; $('sls').textContent = `영상 준비 중 · ${n.duration_sec}초`;
  await waitSec(n.duration_sec); $('slate').style.display = 'none';
}
// ── 기사 관련 차트: 기사를 쓴 시점의 수치(n.event)로, 이벤트 종류에 맞게 ──
let CANDS = null;
async function cands() {
  if (!CANDS) { const d = await api('GET', '/api/public/results'); CANDS = {}; d.candidates.forEach(c => CANDS[c.id] = c); }
  return CANDS;
}
const LEVEL = { WIN_LIKELY: ['당선 유력', 0.3], WIN_SURE: ['당선 확실', 0.6], ELECTED: ['당선 확정', 1.0] };
function hbar(label, value, max, color, text) {
  const w = Math.max(6, Math.round(560 * value / Math.max(1, max)));
  return `<div class="row"><span class="nm">${label}</span><div class="b" style="width:${w}px;background:${color};box-shadow:0 0 22px ${color}"></div><span class="v">${text}</span></div>`;
}
async function drawArticleChart(it) {
  const e = it.event || {}, C = await cands();
  const votes = e.votes || {}, rates = e.vote_rates || {};
  const ids = Object.keys(votes).map(Number);
  const maxRate = Math.max(1, ...ids.map(i => rates[i] || 0));
  const foot = `<div style="position:absolute;left:40px;bottom:24px;font-size:22px;color:#9AA6BC">기사 기준 · 개표 집계 #${e.seq ?? '-'} · ${e.detected_at || ''}</div>`;
  let title, body;
  if (it.event_type === 'LEAD_CHANGE') {
    const a = C[e.prev_leader] || {}, b = C[e.leader] || {};
    title = `${it.region_name} · 1위 변동 (개표율 ${e.counted_rate}%)`;
    body = `<div style="display:flex;align-items:center;justify-content:center;gap:40px;margin:40px 0 30px">
        <div style="text-align:center;opacity:.55"><div style="width:120px;height:120px;border-radius:50%;margin:auto;background:${a.color}"></div>
          <div style="font-size:36px;font-weight:800;margin-top:12px">${esc(a.name || '')}</div><div style="font-size:30px">${rates[e.prev_leader] ?? '-'}%</div></div>
        <div style="font-size:90px;color:#FFB020">➜</div>
        <div style="text-align:center"><div style="width:160px;height:160px;border-radius:50%;margin:auto;background:${b.color};box-shadow:0 0 50px ${b.color}"></div>
          <div style="font-size:46px;font-weight:900;margin-top:12px">${esc(b.name || '')}</div><div style="font-size:36px;font-weight:800">${rates[e.leader] ?? '-'}%</div></div></div>
      <div style="text-align:center;font-size:40px;font-weight:800">격차 <span style="color:#FFB020">${n(e.gap)}표</span></div>`;
  } else if (LEVEL[it.event_type]) {
    const [word, k] = LEVEL[it.event_type], w = C[e.leader] || {};
    const need = Math.round((e.remaining || 0) * k);
    title = `${esc(w.name || '')} ${word}`;
    body = `<div style="font-size:30px;color:#9AA6BC;margin:-10px 0 20px">전체 개표율 ${e.counted_rate}% · 판정 기준: 1·2위 격차 ${k === 1 ? '>' : '≥'} 남은 표${k === 1 ? '' : '의 ' + Math.round(k * 100) + '%'}</div>`
      + hbar('1·2위 격차', e.gap || 0, Math.max(e.gap || 0, need), w.color || '#FF2BD6', `${n(e.gap)}표`)
      + hbar(k === 1 ? '남은 표' : `남은 표의 ${Math.round(k * 100)}%`, need, Math.max(e.gap || 0, need), '#3A4A6B', `${n(need)}표`)
      + `<div style="margin-top:26px">` + ids.map(i => hbar(`기호${i} ${esc((C[i] || {}).name || '')}`, rates[i] || 0, maxRate, (C[i] || {}).color, `${rates[i]}%`)).join('') + `</div>`;
  } else {                                                          // 개표율 구간 돌파 (지역 브리핑도 같은 모양)
    const m = e.milestone;
    title = `${it.region_name} · 개표율 ${m ? m + '% 돌파' : e.counted_rate + '%'}`;
    body = `<div style="height:40px;background:#141C2F;border-radius:20px;overflow:hidden;margin:0 0 8px;position:relative">
        <div style="height:100%;width:${Math.min(100, e.counted_rate)}%;background:linear-gradient(90deg,#00E5FF,#FF2BD6)"></div></div>
      <div style="font-size:28px;color:#9AA6BC;margin-bottom:10px">개표율 ${e.counted_rate}% · 1위 ${esc((C[e.leader] || {}).name || '')} · 격차 ${n(e.gap)}표</div>`
      + ids.map(i => hbar(`기호${i} ${esc((C[i] || {}).name || '')}`, rates[i] || 0, maxRate, (C[i] || {}).color, `${rates[i]}%`)).join('');
  }
  $('ctitle').innerHTML = title;
  $('bars').innerHTML = body + foot;
  regionNow = it.region_code || 'ALL';
}
async function playItem(n) {
  $('bgm').pause(); $('headline').textContent = n.title;
  reading = true;
  try { await drawArticleChart(n); } catch (e) { await drawChart(n.region_code || 'ALL'); }
  let ok = 'DONE';
  try {
    if (n.media === 'AVATAR') {
      const v = $('avatar'); v.style.display = 'block'; v.src = n.src; await v.play();      // 립싱크 아바타 영상이 앵커 자리를 덮음
      await waitMedia(v, (n.duration_sec || 30) * 1.5 + 5); v.style.display = 'none';
    } else if (n.media === 'TTS') {
      const a = $('voice'); a.src = n.audio; await a.play(); await waitMedia(a, (n.duration_sec || 30) * 1.5 + 5);
    } else { ANCHOR.setSpeaking(true); try { await speak(n.script, n.duration_sec || 25); } finally { ANCHOR.setSpeaking(false); } }
  } catch (e) { ok = 'ERROR'; }
  reading = false;
  await api('POST', `/api/onair/queue/${n.queue_id}/done`, { result: ok }).catch(() => {});
}
// 읽을 기사가 없을 때 화면 순환 (BR-09): 전체 → 지도 → 구 5곳 → 격차 카드. 최종 정리(9번 구간)는 전체 ↔ 당선자 카드
const BOARD_VIEWS = ['ALL', 'MAP', 'STAR', 'DEEP', 'DUNE', 'NEBULA', 'ORBIT', 'GAP'];
let boardIdx = 0, finalIdx = 0;
async function drawMapView() {
  const d = await api('GET', '/api/public/results');
  $('ctitle').textContent = `지역별 1위 · 전체 개표율 ${d.counted_rate.toFixed(1)}%`;
  $('bars').innerHTML = '<div id="bigmap" style="width:720px;margin:0 auto"></div><div id="maplegend" style="font-size:26px;color:#9AA6BC;text-align:center;margin-top:10px"></div>';
  drawMap(document.getElementById('bigmap'), d.regions);
  document.getElementById('maplegend').innerHTML = d.candidates.sort((a, b) => a.id - b.id)
    .map(c => `<span style="color:${c.color}">■</span> ${esc(c.name)}`).join('&nbsp;&nbsp;&nbsp;');
  regionNow = 'ALL';
  return '지역별 1위';
}
async function drawGapCard() {
  const d = await api('GET', '/api/public/results');
  const c = [...d.candidates].sort((a, b) => b.votes - a.votes);
  const gap = c.length > 1 ? c[0].votes - c[1].votes : 0;
  const left = d.regions.filter(r => r.counted_rate < 100).length;
  $('ctitle').textContent = '1 · 2위 격차';
  const card = (k, v, color) => `<div style="flex:1;background:#141C2F;border-radius:16px;padding:28px;text-align:center">
    <div style="font-size:28px;color:#9AA6BC">${k}</div><div style="font-size:64px;font-weight:900;color:${color || '#F2F5FA'}">${v}</div></div>`;
  $('bars').innerHTML = `<div style="display:flex;gap:24px;margin-top:30px">${card('1위', esc(c[0].name), c[0].color)}${card('격차', n(gap) + '표')}</div>
    <div style="display:flex;gap:24px;margin-top:24px">${card('전체 개표율', d.counted_rate.toFixed(1) + '%')}${card('개표 중인 구', left + '곳')}</div>`;
  regionNow = 'ALL';
  return '1·2위 격차';
}
async function drawWinnerCard() {
  const d = await api('GET', '/api/public/results');
  const w = d.candidates.find(c => c.winner_flag === 'ELECTED') || [...d.candidates].sort((a, b) => b.votes - a.votes)[0];
  $('ctitle').textContent = w.winner_flag === 'ELECTED' ? '당선 확정' : '현재 1위';
  $('bars').innerHTML = `<div style="text-align:center;margin-top:40px">
    <div style="width:220px;height:220px;border-radius:50%;margin:0 auto;background:${w.color};box-shadow:0 0 60px ${w.color}"></div>
    <div style="font-size:84px;font-weight:900;margin-top:30px">기호${w.id} ${esc(w.name)}</div>
    <div style="font-size:36px;color:#9AA6BC">${esc(w.party || '')} · ${w.rate.toFixed(1)}% · ${n(w.votes)}표</div></div>`;
  regionNow = 'ALL';
  return `${w.name} ${w.winner_flag === 'ELECTED' ? '당선 확정' : '1위'}`;
}
const REGION_NAME = { ALL: '전체 득표 현황', STAR: '별빛구', DEEP: '심해구', DUNE: '사막구', NEBULA: '성운구', ORBIT: '궤도구' };
async function playBoard(n) {
  let head;
  try {
    if (n.segment === 'LIVE' && n.order_no > 6) {                // 최종 결과 정리
      head = (finalIdx++ % 2 === 0) ? (await drawChart('ALL'), '최종 결과 정리') : await drawWinnerCard();
    } else {
      const v = BOARD_VIEWS[boardIdx++ % BOARD_VIEWS.length];
      if (v === 'MAP') head = await drawMapView();
      else if (v === 'GAP') head = await drawGapCard();
      else { await drawChart(v); head = v === 'ALL' ? '실시간 개표 현황' : `${REGION_NAME[v]} 개표 현황`; }
    }
  } catch (e) { head = '실시간 개표 현황'; }
  $('headline').textContent = head;
  if ($('bgm').paused) $('bgm').play().catch(() => {});
  await waitSec(n.wait || 4);
}
async function loop() {
  while (true) {
    let n; abortNow = false;
    try { n = await api('GET', '/api/onair/next'); } catch (e) { await sleep(2000); continue; }
    if (n.kind === 'IDLE' || n.kind === 'PAUSE') { $('bgm').pause(); await sleep(1000); continue; }
    if (n.kind === 'END') { $('bgm').pause(); $('headline').textContent = '개표방송을 마칩니다'; await sleep(3000); continue; }
    if (!startedAt) startedAt = Date.now();
    if (n.kind === 'VIDEO') await playVideo(n);
    else if (n.kind === 'SLATE') await playSlate(n);
    else if (n.kind === 'ITEM') await playItem(n);
    else if (n.kind === 'BOARD') await playBoard(n);
    else await sleep(1000);
  }
}
function setPaused(p) {
  paused = p;
  for (const el of [$('fullv'), $('voice'), $('avatar'), $('bgm')]) { if (p) el.pause(); else if (el.src && el.currentTime > 0 && !el.ended && el !== $('bgm')) el.play().catch(() => {}); }
  if ('speechSynthesis' in window) { p ? speechSynthesis.pause() : speechSynthesis.resume(); }
}
setInterval(() => { if (startedAt) { const s = Math.floor((Date.now() - startedAt) / 1000); $('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); } }, 1000);
drawChart('ALL'); drawTicker();
listen('/api/onair/stream', {
  'results.updated': () => { drawTicker(); if (!reading && document.querySelector('#bars .row')) drawChart(regionNow); },
  'onair.control': d => { if (d.action === 'pause') setPaused(true); if (d.action === 'resume' || d.action === 'start') setPaused(false);
                          if (d.action === 'start' || d.action === 'reset') startedAt = null;
                          if (d.action === 'skip' || d.action === 'reset') { abortNow = true; for (const el of [$('fullv'), $('voice'), $('avatar')]) el.pause();
                            if ('speechSynthesis' in window) speechSynthesis.cancel(); } }
});
$('gate').onclick = () => { $('gate').style.display = 'none'; ANCHOR.attachAudio($('voice')); loop(); };
</script>
</body>
</html>
